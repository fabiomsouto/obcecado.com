AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Lets GitHub Actions in fabiomsouto/obcecado.com deploy the site to the
  existing S3 bucket and CloudFront distribution, and adds the CloudFront
  Function that serves index.html for directory URLs.

Parameters:
  BucketName:
    Type: String
    Description: Name of the existing S3 bucket behind obcecado.com.
  DistributionId:
    Type: String
    Description: ID of the existing CloudFront distribution (e.g. E1ABCDEF234567).
  GitHubRepository:
    Type: String
    Default: fabiomsouto/obcecado.com
  CreateOIDCProvider:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "true"
    Description: >-
      Set to false if this AWS account already has the
      token.actions.githubusercontent.com identity provider.

Conditions:
  MakeProvider: !Equals [!Ref CreateOIDCProvider, "true"]

Resources:
  GitHubOIDCProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: MakeProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]

  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: obcecado-site-deploy
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                # Only pushes to main can deploy; pull requests cannot.
                token.actions.githubusercontent.com:sub: !Sub repo:${GitHubRepository}:ref:refs/heads/main
      Policies:
        - PolicyName: deploy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !Sub arn:aws:s3:::${BucketName}
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:DeleteObject]
                Resource: !Sub arn:aws:s3:::${BucketName}/*
              - Effect: Allow
                Action: cloudfront:CreateInvalidation
                Resource: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${DistributionId}

  IndexRewrite:
    Type: AWS::CloudFront::Function
    Properties:
      Name: obcecado-index-rewrite
      AutoPublish: true
      FunctionConfig:
        Comment: Serve index.html for directory URLs
        Runtime: cloudfront-js-2.0
      # The bucket is read through the S3 REST API, which has no directory
      # indexes: /phonkyo/ has to be fetched as /phonkyo/index.html.
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          var uri = request.uri;
          if (uri.endsWith("/")) {
            request.uri = uri + "index.html";
            return request;
          }
          // /phonkyo -> /phonkyo/, so relative links on the page resolve.
          var last = uri.substring(uri.lastIndexOf("/") + 1);
          if (last.indexOf(".") === -1) {
            return {
              statusCode: 301,
              statusDescription: "Moved Permanently",
              headers: { location: { value: uri + "/" } }
            };
          }
          return request;
        }

Outputs:
  RoleArn:
    Description: Set as the AWS_ROLE_ARN repository variable.
    Value: !GetAtt DeployRole.Arn
  FunctionArn:
    Description: Associate with the distribution's default behaviour, viewer request.
    Value: !GetAtt IndexRewrite.FunctionMetadata.FunctionARN
