{{ define "main" }}
<article class="guide">
  <header class="guide-head">
    <h1>{{ .Title }}</h1>
    {{- with .Params.summary }}
    <p class="lede">{{ . }}</p>
    {{- end }}
  </header>

  <div class="guide-body">
    <nav class="guide-toc" aria-label="Steps">
      {{ .TableOfContents }}
    </nav>
    <div class="guide-text">
      {{ .Content }}
    </div>
  </div>
</article>

{{ partial "copy-code.html" . }}
{{ end }}
