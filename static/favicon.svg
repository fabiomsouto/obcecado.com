<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- A PCB fiducial: a gold pad in a round opening in the black solder mask,
       the mark assembly machines align to. Flat and crisp, like the real thing. -->
  <defs>
    <linearGradient id="pad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ecc463"/>
      <stop offset="1" stop-color="#c9973a"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="7" fill="#101212"/>
  <rect x="0.3" y="0.3" width="31.4" height="31.4" rx="6.7" fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-width="0.6"/>
  <circle cx="16" cy="16" r="11" fill="#2e2620"/>
  <circle cx="16" cy="16" r="6.25" fill="url(#pad)"/>
</svg>
